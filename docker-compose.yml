version: '3'
services:
  web:
    build: .
    container_name: crawler-web
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@db:5432/crawler_db?schema=public&connection_limit=20&pool_timeout=30"
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: "https://diagnostyka.marafiki.pl"
      SESSION_SECRET: "${SESSION_SECRET}"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM_NAME: "SEO Crawler by Marafiki"
      SMTP_FROM_EMAIL: "info@marafiki.pl"
    ports:
      - "3555:3000"
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    container_name: crawler-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: crawler_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: always
